version: "3.9"

services:
  # ── Redis (message broker & result backend) ──────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── PostGIS Database ─────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: disaster
      POSTGRES_PASSWORD: disaster_pass
      POSTGRES_DB: disaster_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disaster"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Application ──────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://disaster:disaster_pass@db:5432/disaster_db
      REDIS_URL: redis://redis:6379/0
      ONNX_MODEL_PATH: checkpoints/siamese_resnet34.onnx
      UPLOAD_DIR: /app/data/uploads
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - upload_data:/app/data/uploads

  # ── Celery Worker ────────────────────────────────────────
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://disaster:disaster_pass@db:5432/disaster_db
      REDIS_URL: redis://redis:6379/0
      ONNX_MODEL_PATH: checkpoints/siamese_resnet34.onnx
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  # ── React Frontend ───────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  redis_data:
  pgdata:
  upload_data:
